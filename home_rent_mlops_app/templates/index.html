<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Rent Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <header class="app-header">
            <h1>🏠 Home Rent Predictor</h1>
            <p>Get an instant, ML-powered estimate of monthly rent</p>
        </header>

        <main class="card">
            {% if error %}
            <div class="alert alert-error">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}

            {% if prediction is not none %}
            <div class="alert alert-success">
                <span class="result-label">Predicted Monthly Rent</span>
                <span class="result-value">₹ {{ "{:,.0f}".format(prediction) }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('predict') }}" method="POST" class="rent-form">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="location">Location</label>
                        <select id="location" name="location" required>
                            <option value="" disabled {% if not form_values.get('location') %}selected{% endif %}>Select a location</option>
                            {% for loc in locations %}
                            <option value="{{ loc }}" {% if form_values.get('location') == loc %}selected{% endif %}>{{ loc }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="bhk">BHK</label>
                        <input type="number" id="bhk" name="bhk" min="1" max="10" required
                               value="{{ form_values.get('bhk', '') }}" placeholder="e.g. 2">
                    </div>

                    <div class="form-group">
                        <label for="area_sqft">Area (sqft)</label>
                        <input type="number" id="area_sqft" name="area_sqft" min="100" max="20000" step="1" required
                               value="{{ form_values.get('area_sqft', '') }}" placeholder="e.g. 750">
                    </div>

                    <div class="form-group">
                        <label for="bathrooms">Bathrooms</label>
                        <input type="number" id="bathrooms" name="bathrooms" min="1" max="10" required
                               value="{{ form_values.get('bathrooms', '') }}" placeholder="e.g. 2">
                    </div>

                    <div class="form-group">
                        <label for="furnishing">Furnishing Type</label>
                        <select id="furnishing" name="furnishing" required>
                            <option value="" disabled {% if not form_values.get('furnishing') %}selected{% endif %}>Select furnishing</option>
                            {% for f in furnishing_types %}
                            <option value="{{ f }}" {% if form_values.get('furnishing') == f %}selected{% endif %}>{{ f }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="parking">Parking Availability</label>
                        <select id="parking" name="parking" required>
                            <option value="1" {% if form_values.get('parking') == '1' %}selected{% endif %}>Yes</option>
                            <option value="0" {% if form_values.get('parking') == '0' %}selected{% endif %}>No</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="btn-predict">Predict Rent</button>
            </form>
        </main>

        <footer class="app-footer">
            <span>Powered by Scikit-Learn &middot; Tracked with MLflow &middot; Served with Flask</span>
        </footer>
    </div>
</body>
</html>
